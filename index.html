<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nikhaz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: white;
      border-radius: 14px;
      padding: 54px 64px;
      max-width: 620px;
      width: 92%;
      box-shadow: 0 4px 28px rgba(0,0,0,0.11);
      text-align: center;
    }

    h1 { font-size: 1.8em; margin-bottom: 16px; color: #222; }
    p  { color: #555; line-height: 1.65; margin-bottom: 18px; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Start screen ── */
    input[type="text"] {
      padding: 11px 16px;
      font-size: 1em;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 220px;
      margin: 8px 0 22px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4a90d9; }

    .btn {
      display: inline-block;
      padding: 13px 36px;
      font-size: 1.05em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
      transition: background 0.15s, transform 0.1s;
      font-weight: 500;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-primary { background: #4a90d9; color: white; }
    .btn-primary:hover:not(:disabled) { background: #3a7fc9; }
    .btn-primary:disabled { background: #c5d8ee; color: #8faec8; cursor: not-allowed;}

    /* ── Trial screen ── */
    #progress-text {
      font-size: 0.9em;
      color: #999;
      margin-bottom: 10px;
    }

    .progress-bar-wrap {
      background: #e8e8e8;
      border-radius: 10px;
      height: 7px;
      margin: 0 0 36px;
      overflow: hidden;
    }
    .progress-bar {
      background: #4a90d9;
      height: 100%;
      border-radius: 10px;
      transition: width 0.35s ease;
    }

    .voice-grid {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 28px;
    }
    .voice-card {
      background: #f7f9fc;
      border: 2px solid #dde5ef;
      border-radius: 12px;
      padding: 22px 28px 20px;
      width: 190px;
      transition: border-color 0.2s, background 0.2s;
    }
    .voice-card.playing {
      border-color: #f0a500;
      background: #fffbf0;
    }
    .voice-card-label {
      font-size: 0.8em;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 14px;
      transition: color 0.2s;
    }
    .voice-card.playing .voice-card-label { color: #e67e22; font-weight: 600; }

    .btn-voice {
      width: 100%;
      padding: 15px 10px;
      font-size: 1.08em;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-voice:hover:not(:disabled) { background: #3a7fc9; }
    .btn-voice:disabled { background: #c5d8ee; color: #8faec8; cursor: not-allowed; }
    .btn-voice.chosen { background: #27ae60; }

    #status {
      font-size: 1em;
      color: #777;
      min-height: 1.6em;
      margin-top: 4px;
    }

    /* ── End screen ── */
    .btn-download { background: #27ae60; color: white; margin-top: 10px; }
    .btn-download:hover { background: #219150; }

    /* ── Induction screens ── */
    #story-screen .container-inner {
      max-width: 820px;
    }
    .click-hint {
      font-size: 0.9em;
      color: #bbb;
      margin-top: 30px;
      letter-spacing: 0.03em;
    }
    #story-pic {
      max-width: 100%;
      border-radius: 10px;
      margin: 22px 0 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    #story-text {
      font-size: 0.95em;
      color: #444;
      line-height: 1.7;
      text-align: left;
      max-height: 340px;
      overflow-y: auto;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      padding: 0 4px;
    }

    /* Create two equal columns that sits next to each other */
    .column {
      flex: 50%;
      padding: 0 4px;
    }

    .column img {
      margin-top: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div class="container">
  <div id="start-screen" class="screen active">
    <h1>Results coming soon!</h1>
  </div>

</div>
</body>
</html>
